# ─────────────────────────────────────────────────────────────────────────────
#  BinMaps — local full-stack Docker setup
#
#  1. cp .env.example .env   (fill in your values)
#  2. docker-compose up --build
#  3. Open http://localhost:4300
#
#  Docker Compose automatically reads variables from .env in this directory.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── AI service (Python / FastAPI) ────────────────────────────────────────
  ai:
    build:
      context: .
      dockerfile: BinMaps.AI/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: "http://localhost:4300"
    restart: unless-stopped

  # ── Backend (ASP.NET Core 8) ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: BinMaps.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Secrets are read from .env by Docker Compose and injected here.
      # ASP.NET Core maps  A__B  →  config["A:B"]
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      Jwt__Key:                             ${JWT_KEY}
      Jwt__Issuer:                          ${JWT_ISSUER}
      Jwt__Audience:                        ${JWT_AUDIENCE}
      ExternalAPIs__OpenWeatherMap__ApiKey: ${OPENWEATHERMAP_API_KEY}
      ExternalAPIs__TomTom__ApiKey:         ${TOMTOM_API_KEY}
      # AI container is reachable by service name inside Docker network
      AISettings__Endpoint:                 "http://ai:8000/analyze"
      AllowedOrigins:                       ${ALLOWED_ORIGINS}
    depends_on:
      - ai
    restart: unless-stopped

  # ── Frontend (Angular + nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: BinMaps.UI/Dockerfile
    ports:
      - "4300:80"
    # Override the Azure-targeted nginx.conf with a local one that proxies
    # to the api container instead of the Azure Container App URL.
    volumes:
      - ./BinMaps.UI/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
