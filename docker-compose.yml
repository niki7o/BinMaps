# ─────────────────────────────────────────────────────────────────────────────
#  BinMaps — local full-stack Docker setup
#
#  1. cp .env.example .env   (fill in your values)
#  2. docker-compose up --build
#  3. Open http://localhost:4300
#
#  env_file: .env passes variables directly to each container WITHOUT
#  shell expansion, so special characters like $ in passwords are safe.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── AI service (Python / FastAPI) ────────────────────────────────────────
  ai:
    build:
      context: .
      dockerfile: BinMaps.AI/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env          # passes ALLOWED_ORIGINS to the Python app
    restart: unless-stopped

  # ── Backend (ASP.NET Core 8) ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: BinMaps.API/Dockerfile
    ports:
      - "8080:8080"
    env_file: .env          # passes ConnectionStrings__, Jwt__, ExternalAPIs__, AllowedOrigins
    environment:
      # These two override whatever is in .env because they depend on the
      # Docker-internal service name "ai", not on an external URL.
      ASPNETCORE_ENVIRONMENT: Production
      AISettings__Endpoint: http://ai:8000/analyze
    depends_on:
      - ai
    restart: unless-stopped

  # ── Frontend (Angular + nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: BinMaps.UI/Dockerfile
    ports:
      - "4300:80"
    # Override the Azure-targeted nginx.conf with the local one that proxies
    # to the "api" container instead of the Azure Container App URL.
    volumes:
      - ./BinMaps.UI/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
