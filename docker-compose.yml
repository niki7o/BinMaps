
services:

  ai:
    build:
      context: .
      dockerfile: BinMaps.AI/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env        
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: BinMaps.API/Dockerfile
    ports:
      - "8080:8080"
    env_file: .env        
    environment:
     
      ASPNETCORE_ENVIRONMENT: Production
      AISettings__Endpoint: http://ai:8000/analyze
    depends_on:
      - ai
    restart: unless-stopped

 
  frontend:
    build:
      context: .
      dockerfile: BinMaps.UI/Dockerfile
    ports:
      - "4300:80"
  
    volumes:
      - ./BinMaps.UI/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
