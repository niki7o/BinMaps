services:

 
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "BinMaps_Pass123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'BinMaps_Pass123!' -Q 'SELECT 1' -No"]
      interval: 10s
      retries: 10
      start_period: 30s


  ai:
    build:
      context: .
      dockerfile: BinMaps.AI/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped


  api:
    build:
      context: .
      dockerfile: BinMaps.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: BinMaps.UI/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqldata: