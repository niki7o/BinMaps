name: Deploy binmaps-ai (AI)

on:
  push:
    branches: [ master ]
    paths:
      # Rebuild the AI image only when Python source or model changes
      - 'BinMaps.AI/**'
      - '.github/workflows/binmaps-ai-AutoDeployTrigger-e5e47781-1e69-4b44-83bd-61c111d71e2b.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BINMAPSAI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BINMAPSAI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BINMAPSAI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: BinMaps.AI/Dockerfile
          registryUrl: binmapsacr.azurecr.io
          registryUsername: ${{ secrets.BINMAPSAI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BINMAPSAI_REGISTRY_PASSWORD }}
          containerAppName: binmaps-ai
          resourceGroup: binmaps-rg
          imageToBuild: binmapsacr.azurecr.io/binmaps-ai:${{ github.sha }}
