name: Deploy binmaps (Frontend)

on:
  push:
    branches: [ master ]
    paths:
      # Rebuild the frontend image when UI source or nginx config changes
      - 'BinMaps.UI/**'
      - '.github/workflows/binmaps-AutoDeployTrigger-d6865efe-d4a6-401a-873d-c3284b0fcdfa.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BINMAPS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BINMAPS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BINMAPS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: BinMaps.UI/Dockerfile
          registryUrl: binmapsacr.azurecr.io
          registryUsername: ${{ secrets.BINMAPS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BINMAPS_REGISTRY_PASSWORD }}
          containerAppName: binmaps
          resourceGroup: binmaps-rg
          imageToBuild: binmapsacr.azurecr.io/binmaps:${{ github.sha }}
