server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    resolver 168.63.129.16 valid=30s;

 
    location /api/ {
        set $backend "https://binmaps-b.bravewater-19dff4c0.westeurope.azurecontainerapps.io";

        proxy_pass         $backend$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header   Host            binmaps-b.bravewater-19dff4c0.westeurope.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     off;
    }

    # ── SignalR / WebSocket hub ──────────────────────────────────────────────
    # Prefix match — covers /hubs/containers and /hubs/containers/negotiate
    location /hubs/ {
        set $backend "https://binmaps-b.bravewater-19dff4c0.westeurope.azurecontainerapps.io";

        proxy_pass         $backend$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header   Host            binmaps-b.bravewater-19dff4c0.westeurope.azurecontainerapps.io;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $http_connection;

        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Long timeouts keep persistent WS connections alive
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ── Uploaded files (profile pictures, report photos) ────────────────────
    location /uploads/ {
        set $backend "https://binmaps-b.bravewater-19dff4c0.westeurope.azurecontainerapps.io";

        proxy_pass         $backend$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header   Host            binmaps-b.bravewater-19dff4c0.westeurope.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     off;
    }

    
    location /analyze {
    proxy_pass https://binmaps-ai.bravewater-19dff4c0.westeurope.azurecontainerapps.io/analyze;
    proxy_ssl_server_name on;
    proxy_set_header Host binmaps-ai.bravewater-19dff4c0.westeurope.azurecontainerapps.io;
}

    # ── Angular SPA — serve built assets, fallback to index.html ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
