<div class="auth-page">
  <div class="auth-bg">
    <div class="auth-orb auth-orb--1"></div>
    <div class="auth-orb auth-orb--2"></div>
    <div class="auth-grid"></div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card animate-slide-up">

      <div class="auth-brand">
        <div class="auth-brand__logo">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path d="M14 2L24 8V20L14 26L4 20V8L14 2Z" stroke="#10b981" stroke-width="1.5" fill="none"/>
            <circle cx="14" cy="14" r="3" fill="#10b981"/>
          </svg>
        </div>
        <span class="auth-brand__name">Bin<span>Maps</span></span>
      </div>

      <div class="auth-header">
        <h1 class="auth-title">Добре дошли</h1>
        <p class="auth-subtitle">Влезте в профила си за достъп до BinMaps</p>
      </div>

      <form (ngSubmit)="submit()" class="auth-form">

        <div class="auth-field">
          <label for="email" class="auth-label">Имейл адрес</label>
          <div class="auth-input-group">
            <svg class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              id="email"
              name="email"
              type="email"
              class="auth-input"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              placeholder="example@mail.com"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="auth-field">
          <label for="password" class="auth-label">Парола</label>
          <div class="auth-input-group">
            <svg class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input
              id="password"
              name="password"
              [type]="showPassword() ? 'text' : 'password'"
              class="auth-input"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button type="button" class="auth-eye" (click)="togglePasswordVisibility()" tabindex="-1">
              <svg *ngIf="!showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-error" *ngIf="errorMessage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <button type="submit" class="btn btn--primary btn--lg auth-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Вход</span>
          <span *ngIf="isLoading" class="auth-loading">
            <svg class="auth-spinner" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none"
                stroke-dasharray="60" stroke-dashoffset="45" stroke-linecap="round"/>
            </svg>
            Влизане...
          </span>
        </button>

        <div class="auth-footer">
          <p>Нямате акаунт?
            <button type="button" class="auth-link" (click)="navigateToRegister()">Регистрирайте се тук</button>
          </p>
        </div>

      </form>
    </div>
  </div>
</div>
