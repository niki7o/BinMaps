<div class="app-wrapper">
  <app-header *ngIf="showShell"></app-header>

  <main [class.app-content]="showShell">
    <router-outlet></router-outlet>
  </main>

  <app-confirm-dialog />
  <app-toast-host />


  <footer class="footer" *ngIf="showShell && !isMapRoute()">
    <div class="footer-container">
      <div class="footer-grid">

        <div class="footer-brand">
          <div class="footer-logo">
            <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
              <path d="M14 2L24 8V20L14 26L4 20V8L14 2Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <circle cx="14" cy="14" r="3.5" fill="currentColor"/>
              <circle cx="14" cy="14" r="1.5" fill="var(--bg-root)"/>
            </svg>
            <span>Bin<span class="brand-accent">Maps</span></span>
          </div>
          <p class="footer-desc">Умно управление на отпадъците в София.</p>
        </div>

        <div class="footer-col">
          <h4>Навигация</h4>
          <ul>
            <li><a routerLink="/">Начало</a></li>
            <li><a routerLink="/map">Карта</a></li>
            <li><a routerLink="/analytics">Анализ</a></li>
            <li><a routerLink="/about">За нас</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <h4>Акаунт</h4>
          <ul>
            <li><a routerLink="/login">Вход</a></li>
            <li><a routerLink="/register">Регистрация</a></li>
            <li><a routerLink="/profile">Профил</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <h4>Правна информация</h4>
          <ul>
            <li><a routerLink="/terms">Условия за ползване</a></li>
            <li>
              <a href="mailto:contact@binmaps.bg" class="footer-contact-link">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
                contact&#64;binmaps.bg
              </a>
            </li>
          </ul>
        </div>

      </div>

      <div class="footer-bottom">
        <p>© 2026 BinMaps · Умни решения за по-чист град · <a routerLink="/terms" class="footer-legal-link">Условия за ползване</a></p>
      </div>
    </div>
  </footer>
</div>
