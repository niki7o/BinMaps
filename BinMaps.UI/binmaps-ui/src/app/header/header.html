<nav class="navbar" [class.is-scrolled]="isScrolled()">
  <div class="navbar__inner">

    <a class="navbar__brand" routerLink="/">
      <div class="navbar__logo">
        <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
          <path d="M14 2L24 8V20L14 26L4 20V8L14 2Z" stroke="#10b981" stroke-width="1.5" fill="none"/>
          <circle cx="14" cy="14" r="3.5" fill="#10b981"/>
          <circle cx="14" cy="14" r="1.5" fill="#0f172a"/>
        </svg>
      </div>
      <span class="navbar__brand-name">Bin<span>Maps</span></span>
    </a>

    <ul class="navbar__links">
      <li><a class="navbar__link" routerLink="/map" routerLinkActive="is-active">Карта</a></li>
      <li *ngIf="isAdmin()">
        <a class="navbar__link" routerLink="/admin" routerLinkActive="is-active">Администрация</a>
      </li>
      <li *ngIf="isLoggedIn()">
        <a class="navbar__link" routerLink="/analytics" routerLinkActive="is-active">Анализ</a>
      </li>
    </ul>

    <div class="navbar__right">

      <button class="navbar__notif"
              *ngIf="isLoggedIn()"
              (click)="toggleNotifPanel($event)"
              [class.has-unread]="unreadCount() > 0"
              title="Известия">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
        <span class="navbar__notif-count" *ngIf="unreadCount() > 0">{{ unreadCount() }}</span>
      </button>

      <div class="notif-panel" *ngIf="showNotifPanel() && isLoggedIn()">
        <div class="notif-panel__header">
          <span>Известия</span>
          <span class="notif-panel__count" *ngIf="unreadCount() > 0">{{ unreadCount() }} нови</span>
        </div>
        <div class="notif-panel__empty">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          </svg>
          <p>Няма нови известия</p>
        </div>
      </div>

      <div class="navbar__user" *ngIf="isLoggedIn()" (click)="toggleUserMenu($event)">
        <div class="navbar__avatar">{{ initials() }}</div>
        <div class="navbar__user-info">
          <span class="navbar__username">{{ currentUser()?.userName }}</span>
          <span class="navbar__role">{{ currentUser()?.role }}</span>
        </div>
        <svg class="navbar__chevron" [class.is-open]="showUserMenu()"
             width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>

      <div class="user-menu" *ngIf="showUserMenu() && isLoggedIn()">
        <a class="user-menu__item" routerLink="/profile" (click)="showUserMenu.set(false)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Профил
        </a>
        <a class="user-menu__item" routerLink="/analytics" (click)="showUserMenu.set(false)" *ngIf="isLoggedIn()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6"  y1="20" x2="6"  y2="14"/>
          </svg>
          Анализ
        </a>
        <a class="user-menu__item" routerLink="/admin" (click)="showUserMenu.set(false)" *ngIf="isAdmin()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
          Администрация
        </a>
        <div class="user-menu__divider"></div>
        <button class="user-menu__item user-menu__item--danger" (click)="logout()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Изход
        </button>
      </div>

      <ng-container *ngIf="!isLoggedIn()">
        <a class="btn btn--ghost btn--sm" routerLink="/login">Вход</a>
        <a class="btn btn--primary btn--sm" routerLink="/register">Регистрация</a>
      </ng-container>

    </div>
  </div>
</nav>
