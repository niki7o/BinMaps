<nav class="navbar" [class.navbar--scrolled]="isScrolled" [class.navbar--solid]="isSolidPage">
  <div class="navbar__inner">

    <a routerLink="/" class="navbar__brand">
      <div class="navbar__logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M14 2L24 8V20L14 26L4 20V8L14 2Z" stroke="#10b981" stroke-width="1.5" fill="none"/>
          <path d="M14 7L20 10.5V17.5L14 21L8 17.5V10.5L14 7Z" fill="#10b981" opacity="0.2"/>
          <circle cx="14" cy="14" r="3" fill="#10b981"/>
        </svg>
      </div>
      <span class="navbar__brand-name">Bin<span>Maps</span></span>
    </a>

    <div class="navbar__center" *ngIf="isLoggedIn">
      <a routerLink="/map" routerLinkActive="is-active" class="navbar__link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/></svg>
        Карта
      </a>
      <a routerLink="/analytics" routerLinkActive="is-active" class="navbar__link" *ngIf="role === 'Admin' || role === 'Driver'">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Анализ
      </a>
      <a routerLink="/admin" routerLinkActive="is-active" class="navbar__link" *ngIf="role === 'Admin'">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Администрация
      </a>
    </div>

    <div class="navbar__actions">
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" class="btn btn--ghost btn--sm">Вход</a>
        <a routerLink="/register" class="btn btn--primary btn--sm">Регистрация</a>
      </ng-container>

      <ng-container *ngIf="isLoggedIn">
        <button
          class="navbar__notif-btn"
          (click)="toggleNotifications()"
          [class.has-unread]="unreadCount > 0"
          aria-label="Известия">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="navbar__notif-count" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
        </button>

        <div class="navbar__user" (click)="toggleUserMenu()" [class.is-open]="userMenuOpen">
          <div class="navbar__avatar">
            <span>{{ userInitials }}</span>
          </div>
          <div class="navbar__user-info hide-mobile">
            <span class="navbar__user-name">{{ userName }}</span>
            <span class="navbar__user-role">{{ roleLabel }}</span>
          </div>
          <svg class="navbar__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>

          <div class="navbar__dropdown" *ngIf="userMenuOpen">
            <a routerLink="/profile" class="navbar__dropdown-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Профил
            </a>
            <a routerLink="/settings" class="navbar__dropdown-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
              Настройки
            </a>
            <div class="navbar__dropdown-divider"></div>
            <button class="navbar__dropdown-item navbar__dropdown-item--danger" (click)="logout()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Изход
            </button>
          </div>
        </div>
      </ng-container>
    </div>

  </div>
</nav>

<div class="notif-panel" [class.is-open]="notifPanelOpen">
  <div class="notif-panel__header">
    <div>
      <h3 class="notif-panel__title">Известия</h3>
      <p class="notif-panel__meta">{{ unreadCount }} непрочетени</p>
    </div>
    <div class="notif-panel__header-actions">
      <button class="btn btn--ghost btn--sm" (click)="markAllRead()">Прочети всички</button>
      <button class="btn btn--icon btn--ghost" (click)="toggleNotifications()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <div class="notif-panel__filters">
    <button class="notif-filter-btn" [class.is-active]="notifFilter === 'all'" (click)="notifFilter = 'all'">Всички</button>
    <button class="notif-filter-btn" [class.is-active]="notifFilter === 'critical'" (click)="notifFilter = 'critical'">Критични</button>
    <button class="notif-filter-btn" [class.is-active]="notifFilter === 'route'" (click)="notifFilter = 'route'" *ngIf="role === 'Driver'">Маршрут</button>
    <button class="notif-filter-btn" [class.is-active]="notifFilter === 'reports'" (click)="notifFilter = 'reports'" *ngIf="role === 'Admin'">Сигнали</button>
  </div>

  <div class="notif-panel__list">
    <div
      *ngFor="let n of filteredNotifications"
      class="notif-item"
      [class.is-unread]="!n.read"
      [class.danger]="n.severity === 'critical'">

      <div class="notif-item__icon" [ngClass]="'notif-item__icon--' + n.iconType">
        <svg *ngIf="n.type === 'fire'" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c0 0-5 6-5 11a5 5 0 0010 0c0-5-5-11-5-11zm0 14a2 2 0 110-4 2 2 0 010 4z"/></svg>
        <svg *ngIf="n.type === 'full'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <svg *ngIf="n.type === 'report'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <svg *ngIf="n.type === 'route'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>

      <div class="notif-item__content">
        <p class="notif-item__title">{{ n.title }}</p>
        <p class="notif-item__desc">{{ n.description }}</p>
        <span class="notif-item__time">{{ n.timeAgo }}</span>
      </div>

      <div class="notif-item__dot" *ngIf="!n.read"></div>
    </div>

    <div class="notif-panel__empty" *ngIf="filteredNotifications.length === 0">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      <p>Нямате известия</p>
    </div>
  </div>
</div>

<div class="notif-overlay" *ngIf="notifPanelOpen" (click)="toggleNotifications()"></div>
