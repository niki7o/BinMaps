<svg width="32" height="32" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- shadow -->
  <ellipse cx="12" cy="23.5" rx="5.5" ry="0.8" fill="rgba(0,0,0,0.25)"/>

  <!-- handle -->
  <rect x="9" y="1.2" width="6" height="2.6" rx="1.3" fill="#1e293b"/>

  <!-- lid -->
  <rect x="3.5" y="3.8" width="17" height="3" rx="1.5" fill="#334155"/>

  <!-- body -->
  <path d="M4.5 6.8 L19.5 6.8 L18.2 21.8 Q18 22.8 17 22.8 H7 Q5.8 22.8 5.8 21.8 Z" fill="#475569"/>

  <!-- gloss -->
  <rect x="4.5" y="6.8" width="2.8" height="15" rx="1.2" fill="rgba(255,255,255,0.07)"/>

  <!-- sensor signal arcs (faded / broken cyan) -->
  <path d="M14.5 8.5 Q17 10.5 17 13 Q17 15.5 14.5 17.5"
    fill="none" stroke="#0e7490" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
  <path d="M13 10 Q15 11.5 15 13 Q15 14.5 13 16"
    fill="none" stroke="#0e7490" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>

  <!-- sensor dot (broken = dim) -->
  <circle cx="11.5" cy="13" r="1.5" fill="#0e7490" opacity="0.6"/>

  <!-- big red X over sensor area -->
  <line x1="9"  y1="9.5"  x2="16.5" y2="17" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16.5" y1="9.5" x2="9"  y2="17" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
</svg>
