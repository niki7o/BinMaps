    C 11  7   12.5  7.5  13   6.5
    C 14  5   13.5  3    14   1.5
    C 15.5 4   15   7.5  15.5  10
    C 16   12  15   14   12   14 Z"
    fill="#ef4444"/>
  <!-- center inner bright -->
  <path d="M12 13.5 C11 11.5 11.5 9 12 7.5 C12.5 9.5 13 11.5 13.5 13 C13 11.5 12.5 10 12 13.5 Z"
    fill="#fbbf24"/>

