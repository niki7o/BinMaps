  <!-- ── Sparks ── -->
  <circle cx="16.5" cy="4"   r="0.85" fill="#fde68a" opacity="0.95"/>
  <circle cx="7.5"  cy="7"   r="0.75" fill="#fde68a" opacity="0.85"/>
  <circle cx="14"   cy="2.5" r="0.65" fill="#fff"    opacity="0.75"/>
  <circle cx="9"    cy="5"   r="0.55" fill="#fbbf24" opacity="0.85"/>
