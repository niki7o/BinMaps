  <path d="M9 14
    C 8   12   8.5  10   9.5   8
    C 9   10   10   10   10.5   9
    C 11   8   10.5  6.5  11   6
    C 11.5  8   11.5  11   11   13
    C 10.5  14   9.5  14   9   14 Z"
    fill="#f97316"/>

  <!-- ── Right flame (medium, y 14→5) ── -->
  <path d="M15 14
    C 14  11.5  14   9   14.5   7
    C 14   9   15   9   15.5   8.5
    C 16   7.5  15.5  5.5  16   5
    C 17   7   16.5   10  17   11.5
    C 17   13   16   14   15   14 Z"
