<svg width="32" height="32" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- ── Bin body (lower half, charred) ── -->
  <rect x="9" y="12" width="6" height="2" rx="1" fill="#7f1d1d"/>
  <rect x="3.5" y="14" width="17" height="2.8" rx="1.4" fill="#991b1b"/>
  <rect x="4.5" y="16.8" width="15" height="6.5" rx="1.5" fill="#b91c1c"/>
  <line x1="9.5"  y1="17.5" x2="9.5"  y2="23" stroke="rgba(0,0,0,0.22)" stroke-width="0.9"/>
  <line x1="14.5" y1="17.5" x2="14.5" y2="23" stroke="rgba(0,0,0,0.22)" stroke-width="0.9"/>

  <!-- ── Center flame (tallest, y 14→1) ── -->
