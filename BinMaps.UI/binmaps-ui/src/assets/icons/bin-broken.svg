<svg width="32" height="32" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- drop shadow -->
  <ellipse cx="12.5" cy="23.5" rx="5.5" ry="0.8" fill="rgba(0,0,0,0.25)"/>

  <!-- ── Handle (tilted 4°) ── -->
  <rect x="9" y="1.2" width="6" height="2.6" rx="1.3" fill="#1e293b"
    transform="rotate(-4 12 2.5)"/>

  <!-- ── Lid ── -->
  <rect x="3.5" y="3.8" width="17" height="3" rx="1.5" fill="#334155"/>

  <!-- ── Body (left slab & right slab split by crack) ── -->
  <!-- left piece -->
  <path d="M4.5 6.8 L12 6.8 L11 22.3 Q11 22.8 10 22.8 H6 Q4.5 22.8 4.5 21.8 Z"
    fill="#5a6a7a"/>
  <!-- right piece (slightly shifted to show break) -->
  <path d="M12.5 6.8 L19.5 6.8 L18.5 21.8 Q18.5 22.8 17 22.8 H13.5 Q12.5 22.8 12.5 22 Z"
    fill="#4e5f6e" transform="translate(0.4 0.4) rotate(1.2 16 14)"/>

  <!-- gloss left -->
  <rect x="4.5" y="6.8" width="2.8" height="15.5" rx="1.2" fill="rgba(255,255,255,0.07)"/>

  <!-- ── MAIN CRACK — bold lightning bolt ── -->
  <polyline points="12.2,6.8 9.5,13.5 14,13.5 11,22.3"
    fill="none" stroke="#0f172a" stroke-width="2.6"
    stroke-linejoin="round" stroke-linecap="round"/>
  <!-- crack highlight (bright edge = depth) -->
  <polyline points="12.2,6.8 9.5,13.5 14,13.5 11,22.3"
    fill="none" stroke="rgba(226,232,240,0.22)" stroke-width="0.7"
    stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ── Radiating stress cracks from junction ── -->
  <line x1="14"  y1="13.5" x2="18"  y2="17"   stroke="#0f172a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="9.5" y1="13.5" x2="6"   y2="16.5" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="12.2" y1="6.8" x2="15.5" y2="10"  stroke="#0f172a" stroke-width="1"   stroke-linecap="round" opacity="0.75"/>

  <!-- ── Flying debris chips ── -->
  <polygon points="17,10 18.8,9 18.2,11.8" fill="#2d3f4e" opacity="0.8"/>
  <polygon points="5.5,14.5 7.5,13 6.8,16"  fill="#2d3f4e" opacity="0.7"/>
</svg>
