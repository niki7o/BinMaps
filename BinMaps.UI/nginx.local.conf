# nginx config for LOCAL Docker Compose (docker-compose.yml).
# The "api" service is reachable by its service name on the Docker network.
# For Azure deployment the baked-in nginx.conf is used instead (no volume mount).

server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Docker's internal DNS resolver
    resolver 127.0.0.11 valid=5s;

    # ── REST API ────────────────────────────────────────────────────────────
    location /api/ {
        set $backend "http://api:8080";
        proxy_pass         $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ── SignalR / WebSocket hub ─────────────────────────────────────────────
    location /hubs/ {
        set $backend "http://api:8080";
        proxy_pass         $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $http_connection;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ── Uploaded files ──────────────────────────────────────────────────────
    location /uploads/ {
        set $backend "http://api:8080";
        proxy_pass       $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host     $host;
        proxy_redirect   off;
    }

    # ── Angular SPA ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
